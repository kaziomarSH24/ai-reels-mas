name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            kaziomar/snapclip-reels:latest
            kaziomar/snapclip-reels:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file from GitHub Secret
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Copy Compose, Nginx and Env files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker-compose.yml,nginx-prod/,.env"
          target: "/home/${{ secrets.SSH_USERNAME }}/snapclip-reels"
          overwrite: true

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /home/${{ secrets.SSH_USERNAME }}/snapclip-reels
            # Login to docker hub on the server in case the repo is private
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            # Force pull the latest image from Docker Hub
            docker compose -f docker-compose.yml pull
            
            # Restart the services with the new image and passwords
            docker compose -f docker-compose.yml up -d
            
            echo "Waiting 10 seconds for containers to initialize..."
            sleep 10
            
            echo "--- DB CONTAINER LOGS ---"
            docker logs snapclip_db --tail 50
            
            echo "--- APP CONTAINER LOGS ---"
            docker logs snapclip_app --tail 50
            
            # Run database seeders to create initial admin user
            docker exec snapclip_app php artisan db:seed --force || true
            
            # Optional: Clean up old unused images to save VM space
            docker image prune -f
