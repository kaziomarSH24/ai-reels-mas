version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-reels-app
    container_name: ai_reels_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      # Here you will keep your raw movies and subtitle files
      - ./movies_dataset:/var/www/storage/app/movies 
    networks:
      - ai-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: ai_reels_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - .:/var/www
    networks:
      - ai-network
    depends_on:
      - app

  ai_api:
    image: ai-reels-app
    container_name: ai_reels_python_api
    restart: unless-stopped
    working_dir: /var/www/python_engine
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    ports:
      - "8001:8001"
    volumes:
      - .:/var/www
    networks:
      - ai-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ai_reels_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_reels_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - ai-network
    ports:
      - "3307:3306"

networks:
  ai-network:
    driver: bridge

volumes:
  dbdata:
