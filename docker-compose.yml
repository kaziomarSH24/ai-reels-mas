version: '3.8'

services:
  app:
    image: kaziomar/snapclip-reels:latest
    container_name: snapclip_app
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    volumes:
      - storage_volume:/var/www/storage
      - public_assets:/var/www/public
    networks:
      - snapclip_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  horizon:
    image: kaziomar/snapclip-reels:latest
    container_name: snapclip_horizon
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    command: ["queue", "horizon"]
    volumes:
      - storage_volume:/var/www/storage
    networks:
      - snapclip_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: snapclip_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - public_assets:/var/www/public:ro
      - storage_volume:/var/www/storage:ro
    networks:
      - snapclip_network
    depends_on:
      - app

  ai_api:
    image: kaziomar/snapclip-reels:latest
    container_name: snapclip_api
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    command: ["api"]
    ports:
      - "8001:8001"
    volumes:
      - storage_volume:/var/www/storage
    networks:
      - snapclip_network
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: snapclip_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - snapclip_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.0
    container_name: snapclip_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: snapclip_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - snapclip_network
    healthcheck: 
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  snapclip_network:
    driver: bridge

volumes:
  dbdata:
  redis_data:
  storage_volume:
  public_assets:
